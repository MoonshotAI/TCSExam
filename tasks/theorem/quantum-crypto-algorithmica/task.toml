difficulty_explanation = "L2 statement-fidelity task: the single main theorem packages the entire Gaussian-walk analysis of the paper's Section 3 (truncated polarizing walk, three claims, conditioned telescoping assembly, sign-rounding); no ground truth is provided."
source_paper = "William Kretschmer, Luowen Qian, Makrand Sinha, Avishay Tal: Quantum cryptography in Algorithmica, STOC 2023; arXiv 2212.00879v2."

