[task]
name = "tcsexam/lean-quantum-crypto-algorithmica-bare-proof"
version = "0.1.0"
description = "Prove Theorem 10 of KQST23 (Kretschmer-Qian-Sinha-Tal, STOC 2023 / arXiv 2212.00879): pseudorandomness of the discrete Forrelation distribution against restriction-closed Boolean families of bounded level-2 Fourier mass, in Lean 4 (machine-verified). L2: statement fidelity only, no ground truth."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["lean4", "mathlib", "formal-proof", "analysis-of-boolean-functions", "pseudorandomness", "forrelation", "gaussian-walk", "fourier-analysis", "type-2"]

[metadata]
family_id = "fam-quantum-crypto-algorithmica"
