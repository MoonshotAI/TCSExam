version = "0.1.0"
description = "Prove the Jaber-Liu-Lovett-Ostuni-Sawhney quasipolynomial bound for the corners theorem (FOCS 2025 best paper, arXiv 2504.07006, Theorem 1.1) in Lean 4 (machine-verified), given only the main theorem statement. L2: statement fidelity only, no ground truth."
authors = [{ name = "TCSExam Contributors" }]
