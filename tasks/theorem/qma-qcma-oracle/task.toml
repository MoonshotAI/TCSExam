artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/lean-qma-qcma-oracle-bare-proof"
version = "0.1.1"
description = "Prove a conditional query and witness-size separation for spectral Forrelation in Lean 4: constant-query verification with n-qubit quantum witnesses versus polynomially bounded classical witnesses and queries, using the stated amplification, concentration and sampling hypotheses."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["lean4", "mathlib", "formal-proof", "quantum-complexity", "QMA", "QCMA", "oracle-separation", "spectral-forrelation", "compressed-oracle", "type-2"]

[metadata]
family_id = "fam-qma-qcma-oracle"
candidate_id = "cand-bhnz26-qma-qcma-oracle"
problem_class = "lean-proof-l2"
scaffold_level = "bare-proof"
difficulty_explanation = "Only the main statement is supplied. Construct the quantum verifier and prove the classical-witness query lower bound using the given hypotheses."
source_paper = "Bostanci, Haferkamp, Nirkhe, Zhandry: Separating QMA from QCMA with a classical oracle, STOC 2026; arXiv 2511.09551v2."

[verifier]
timeout_sec = 18000.0

[agent]
timeout_sec = 43200.0

[environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384
storage_mb = 20480

[verifier.environment]
docker_image = "<PUBLIC_REGISTRY>/tcsexam:build-theorem-qma-qcma-oracle-verifier"
network_mode = "no-network"
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384
storage_mb = 20480
