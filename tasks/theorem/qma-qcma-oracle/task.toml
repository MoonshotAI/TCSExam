artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/lean-qma-qcma-oracle-bare-proof"
version = "0.1.0"
description = "Prove the Bostanci-Haferkamp-Nirkhe-Zhandry classical oracle separation between QMA and QCMA (STOC 2026, arXiv 2511.09551, Theorem 14.1 with the QMA containment) in Lean 4 (machine-verified), given only the main theorem statement. L2: statement fidelity only, no ground truth."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["lean4", "mathlib", "formal-proof", "quantum-complexity", "QMA", "QCMA", "oracle-separation", "spectral-forrelation", "compressed-oracle", "type-2"]

[metadata]
family_id = "fam-qma-qcma-oracle"
candidate_id = "cand-bhnz26-qma-qcma-oracle"
problem_class = "lean-proof-l2"
scaffold_level = "bare-proof"
difficulty_explanation = "L2 statement-fidelity task: only the main theorem statement is given; the whole sampler reduction, Strong-distribution analysis and asymptotic comparison must be reconstructed; no ground truth is provided."
source_paper = "Bostanci, Haferkamp, Nirkhe, Zhandry: Separating QMA from QCMA with a classical oracle, STOC 2026; arXiv 2511.09551v2."

[verifier]
timeout_sec = 18000.0

[agent]
timeout_sec = 43200.0

[environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384
storage_mb = 20480

[verifier.environment]
docker_image = "<PUBLIC_REGISTRY>/tcsexam:build-theorem-qma-qcma-oracle-verifier"
