artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/lean-mts-diamond-lb-bare-proof"
version = "0.1.0"
description = "Prove Section 3.4 of Bubeck-Coester-Rabani, STOC 2023 / arXiv 2211.05753v2 — the recursive-diamond Omega((log n / log log n)^2) distributional lower bound for small-set chasing on n-point metric spaces — in Lean 4 from the bare statement (machine-verified). L2: statement fidelity only, no ground truth."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["lean4", "mathlib", "formal-proof", "online-algorithms", "metrical-task-systems", "k-server", "small-set-chasing", "lower-bounds", "type-2"]

[metadata]
family_id = "fam-mts-diamond-lb"
candidate_id = "cand-bcr23-kserver"
problem_class = "lean-proof-l2"
scaffold_level = "bare-proof"
difficulty_explanation = "L2 statement-fidelity task, bare tier: the full Section 3 chain (diamond-family construction, three-stage hard sequence, stage cost bounds, escape-price induction, recurrence inversion) must be rebuilt from the one-line statement; no ground truth is provided."
source_paper = "Sebastien Bubeck, Christian Coester, Yuval Rabani: The Randomized k-Server Conjecture is False!, STOC 2023 (581-594); arXiv 2211.05753v2."

