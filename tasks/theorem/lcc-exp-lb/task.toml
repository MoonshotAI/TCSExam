artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/lean-lcc-exp-lb-bare-proof"
version = "0.1.0"
description = "Prove the Kothari-Manohar exponential lower bound for linear 3-query locally correctable codes (STOC 2024, arXiv 2311.00558; Lemmas 5.7, 6.3, 7.1, 7.3, 7.4 and Theorem 1) in Lean 4 (machine-verified). L2: statement fidelity only, no ground truth. [bare variant: main theorem only, 0/1]"
authors = [{ name = "TCSExam Contributors" }]
keywords = ["lean4", "mathlib", "formal-proof", "coding-theory", "locally-correctable-codes", "kikuchi-matrices", "xor-formulas", "spectral-refutation", "type-2"]

[metadata]
family_id = "fam-lcc-kikuchi"
candidate_id = "cand-km24-lcc-exp-lb"
problem_class = "lean-proof-l2"
scaffold_level = "bare-proof"
difficulty_explanation = "L2 statement-fidelity task: the proofs need chain-hypergraph combinatorics, a greedy regularity partition, Kikuchi matrix quadratic-form identities, and row-pruning tail-bound assembly; no ground truth is provided."
source_paper = "Kothari, Manohar: An Exponential Lower Bound for Linear 3-Query Locally Correctable Codes, STOC 2024; arXiv 2311.00558v1."

[verifier]
timeout_sec = 18000.0

[agent]
timeout_sec = 43200.0

[environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384
storage_mb = 20480

[verifier.environment]
docker_image = "<PUBLIC_REGISTRY>/tcsexam:build-theorem-lcc-exp-lb-verifier"
network_mode = "no-network"
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384
storage_mb = 20480
