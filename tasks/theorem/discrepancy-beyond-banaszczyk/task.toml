artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/lean-discrepancy-beyond-banaszczyk-bare-proof"
version = "0.1.0"
description = "Prove the BJ26 beyond-Banaszczyk chain (Theorem 2.2 SDP feasibility, Fact A.2 Freedman tail, Lemma A.3 row bound, Theorem 3.7 decoupling, multi-layer Lemma 3.6, Lemma 5.2 level sparsity, Theorem 1.3 Beck-Fiala for k >= log^2 n of Bansal-Jiang, STOC 2026 / arXiv 2508.03961) in Lean 4 (machine-verified). L2: statement fidelity only, no ground truth. [bare variant: main theorem only, 0/1]"
authors = [{ name = "TCSExam Contributors" }]
keywords = ["lean4", "mathlib", "formal-proof", "discrepancy", "beck-fiala", "komlos", "banaszczyk", "sdp-guided-random-walk", "spectral-independence", "type-2"]

[metadata]
family_id = "fam-discrepancy-beyond-banaszczyk"
candidate_id = "cand-bj26-beck-fiala-large-k"
problem_class = "lean-proof-l2"
scaffold_level = "bare-proof"
difficulty_explanation = "L2 statement-fidelity task: the proofs need SDP duality, Freedman-type martingale concentration, truncated moment-generating-function bookkeeping, second-moment computations for the SDP-guided walk, and a multi-layer induction with delicate parameter arithmetic; no ground truth is provided."
source_paper = "Nikhil Bansal, Haotian Jiang: Decoupling via Affine Spectral-Independence: Beck-Fiala and Komlós Bounds Beyond Banaszczyk, STOC 2026; arXiv 2508.03961."

[verifier]
timeout_sec = 18000.0

[agent]
timeout_sec = 43200.0

