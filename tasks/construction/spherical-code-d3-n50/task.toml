artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/spherical-code-d3-n50-lean-open"
version = "1.0.0"
description = "Certify in Lean 4 a spherical code for the Tammes problem at N = 50: a list of 50 nonzero rational vectors in Q^3 with every normalized pairwise inner product <= T (a machine-checked upper bound on the optimal maximal cosine; published record r* = 0.868173209126897..., Szekely 1974; beating the record line 0.868173209126 is a literature-level new result)."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["construction", "spherical-code", "tammes-problem", "lean4", "machine-checked", "open-problem"]

[metadata]
family_id = "fam-spherical-code-d3-n50"
candidate_id = "cand-spherical-code-d3-n50-lean-open"
problem_class = "open-construction-lean"
scaffold_level = "open"
difficulty_explanation = "Prove existence of a 50-point rational spherical-code certificate in Lean 4 with only a computable normalized-inner-product predicate given; the agent chooses the threshold T and the construction. The published record (Szekely 1974) can in principle be beaten — any certified T < 0.868173209126897... is a literature-level new result that has resisted ~52 years of numerical optimization."

[verifier]
timeout_sec = 18000.0

[agent]
timeout_sec = 43200.0

[environment]
os = "linux"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
storage_mb = 20480

[verifier.environment]
docker_image = "<PUBLIC_REGISTRY>/tcsexam:build-construction-spherical-code-d3-n50-verifier"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
storage_mb = 20480
