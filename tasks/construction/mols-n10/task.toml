artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/mols-n10-lean-open"
version = "1.0.0"
description = "Certify in Lean 4 a family of k pairwise orthogonal Latin squares of order n (a machine-checked lower bound N(n) >= k on the MOLS-count function; per-order published records N(10)>=2 ... N(24)>=7; exceeding the record at any grid order is a literature-level new result, k = 3 at n = 10 settles a 66-year-old problem)."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["construction", "mols", "latin-squares", "combinatorial-design", "lean4", "machine-checked", "open-problem"]

[metadata]
family_id = "fam-mols-n10"
candidate_id = "cand-mols-n10-lean-open"
problem_class = "open-construction-lean"
scaffold_level = "open"
difficulty_explanation = "Prove existence of a family of pairwise orthogonal Latin squares in Lean 4 with only computable Latin/orthogonality predicates given; the agent chooses the order n and the family size k. The published per-order records can be tied (record families exist in the SageMath/Handbook literature) and in principle beaten (any k above the table is a new result; k = 3 at n = 10 settles N(10) = 3, open since Parker 1959)."

[verifier]
timeout_sec = 18000.0

[agent]
timeout_sec = 43200.0

[environment]
os = "linux"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
storage_mb = 20480

[verifier.environment]
docker_image = "<PUBLIC_REGISTRY>/tcsexam:build-construction-mols-n10-verifier"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
storage_mb = 20480
