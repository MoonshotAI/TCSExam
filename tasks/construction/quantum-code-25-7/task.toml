artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/quantum-code-25-7-lean-open"
version = "1.0.0"
description = "Certify in Lean 4 a qubit stabilizer code [[25,7]] with minimum distance at least d (lower-bound certificates; published record d = 5 standing since 2005-06-24, codetables.de; proven upper bound 7, Rains quantum LP bound)."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["construction", "quantum-error-correction", "stabilizer-code", "lean4", "machine-checked", "open-problem"]

[metadata]
family_id = "fam-quantum-code-25-7"
candidate_id = "cand-quantum-code-25-7-lean-open"
problem_class = "open-construction-lean"
scaffold_level = "open"
difficulty_explanation = "Prove existence of an 18-generator stabilizer code with distance >= d in Lean 4 with only a computable N(S)\\S distance predicate given; the agent chooses d and the construction. The published record (d = 5) can be tied and in principle broken (d = 6 is a literature-level new lower bound; d = 7 meets the proven LP upper bound and closes the parameter point)."

[verifier]
timeout_sec = 18000.0

[agent]
timeout_sec = 43200.0

[environment]
os = "linux"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
storage_mb = 20480

[verifier.environment]
docker_image = "<PUBLIC_REGISTRY>/tcsexam:build-construction-quantum-code-25-7-verifier"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
storage_mb = 20480
