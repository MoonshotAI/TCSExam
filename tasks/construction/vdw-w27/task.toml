artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/vdw-w27-lean-open"
version = "1.0.0"
description = "Certify in Lean 4 a 2-coloring of {1..N} with no monochromatic 7-term arithmetic progression (W(2,7) lower-bound certificates; published record 3703, Rabung-Lotts 2012)."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["construction", "van-der-waerden", "lean4", "machine-checked", "open-problem"]

[metadata]
family_id = "fam-vdw-w27"
candidate_id = "cand-vdw-w27-lean-open"
problem_class = "open-construction-lean"
scaffold_level = "open"
difficulty_explanation = "Prove existence of a valid coloring in Lean 4 with only a computable AP-free predicate given; the agent chooses N and the construction. The published record (3703) can be tied and in principle broken (3704 is a literature-level new result that survived a ~500-CPU-year search)."

[verifier]
timeout_sec = 18000.0

[agent]
timeout_sec = 43200.0

[environment]
os = "linux"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 8192

