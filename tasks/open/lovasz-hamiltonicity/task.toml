artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/open-lovasz-hamiltonicity"
version = "0.1.0"
description = "Prove or refute Lovász's Hamiltonicity conjecture (Lovász 1969: every finite connected vertex-transitive graph has a Hamiltonian path — a path, not a cycle; the Petersen graph is the standard counterexample to the cycle version) in Lean 4 (machine-verified). Open problem: no ground truth; the Lean kernel is the judge. A kernel-verified proof of either direction scores 1.0, otherwise 0 — no partial credit."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["lean4", "mathlib", "formal-proof", "graph-theory", "vertex-transitive", "hamiltonian-path", "open-conjecture", "prove-or-refute", "type-2"]

[metadata]
family_id = "fam-lovasz-hamiltonicity"
candidate_id = "cand-lovasz-hamiltonicity"
problem_class = "lean-open-conjecture"
scaffold_level = "prove-or-refute-v1"
difficulty_explanation = "Open conjecture (unresolved since 1969; best circumference lower bound n^(13/21) by Groenland-Johnston-Scott-Tan 2025). Full score needs a kernel-verified proof or disproof of the conjecture itself; there are no checkpoint slots and no partial credit."
source_paper = "L. Lovász, research problem posed 1969, published in Combinatorial Structures and Their Applications (Proc. Calgary Internat. Conf. 1969), Gordon and Breach 1970. Frontier: Babai 1979 (Omega(sqrt n) cycle); DeVos 2023; Groenland-Johnston-Scott-Tan 2025 (n^(13/21))."

[verifier]
timeout_sec = 18000.0

[agent]
timeout_sec = 43200.0

[environment]
os = "linux"
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384
storage_mb = 20480

[verifier.environment]
docker_image = "<PUBLIC_REGISTRY>/tcsexam:build-open-lovasz-hamiltonicity-verifier"
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384
storage_mb = 20480
