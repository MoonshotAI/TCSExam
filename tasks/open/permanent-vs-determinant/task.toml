artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/open-permanent-vs-determinant"
version = "0.1.0"
description = "Prove or refute Valiant's permanent-vs-determinant conjecture (1979: the n x n permanent cannot be written as the determinant of a polynomial-size matrix of affine linear forms, i.e. determinantal complexity dc(perm_n) is superpolynomial) in Lean 4 (machine-verified). Open problem: no ground truth; the Lean kernel is the judge. Proving either main statement (conj or refuted) scores 1.0; there is no partial credit."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["lean4", "mathlib", "formal-proof", "algebraic-complexity", "permanent", "determinantal-complexity", "vp-vs-vnp", "open-conjecture", "prove-or-refute", "type-2"]

[metadata]
family_id = "fam-permanent-vs-determinant"
candidate_id = "cand-permanent-vs-determinant"
problem_class = "lean-open-conjecture"
scaffold_level = "prove-or-refute-v1"
difficulty_explanation = "Open conjecture (unresolved since 1979; best lower bound n^2/2 by Mignon-Ressayre 2004, best upper bound 2^n - 1 by Grenet 2011, dc(perm_4) already unknown). Full score needs a kernel-verified proof of one of the two main statements (conj or refuted); there are no checkpoints and no partial credit."
source_paper = "L. G. Valiant, The complexity of computing the permanent, Theoret. Comput. Sci. 8 (1979), 189-201. Background survey: metric-graph-algcomplexity.md (historical report not included in this package) (short name det-perm-projection)."

[verifier]
timeout_sec = 18000.0

[agent]
timeout_sec = 43200.0

[environment]
os = "linux"
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384
storage_mb = 20480

[verifier.environment]
docker_image = "<PUBLIC_REGISTRY>/tcsexam:build-open-permanent-vs-determinant-verifier"
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384
storage_mb = 20480
