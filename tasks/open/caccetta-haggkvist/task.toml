artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/open-caccetta-haggkvist"
version = "0.1.0"
description = "Prove or refute the Caccetta–Häggkvist conjecture (1978: every loopless digraph on n vertices with minimum out-degree at least k has a directed cycle of length at most ceil(n/k)) in Lean 4 (machine-verified). Open problem: proving either the conjecture or its negation scores 1.0; no partial credit."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["lean4", "mathlib", "formal-proof", "extremal-graph-theory", "digraph", "girth", "open-problem", "type-2"]

[metadata]
family_id = "fam-open-conjectures"
candidate_id = "cand-caccetta-haggkvist"
problem_class = "open-conjecture-proof"
scaffold_level = "prove-or-refute-v1"
difficulty_explanation = "Open problem since 1978; best known constant for the triangle case is 0.3465 (Hladký–Král'–Norin) vs the conjectured 1/3. Proving either the conjecture or its negation scores 1.0; there is no partial credit."
source_paper = "Caccetta, Häggkvist: On minimal digraphs with given girth, Proc. 9th Southeastern Conference on Combinatorics, Graph Theory and Computing (Congressus Numerantium 21), 1978, pp. 181-187."

[verifier]
timeout_sec = 18000.0

[agent]
timeout_sec = 43200.0

[environment]
os = "linux"
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384
storage_mb = 20480

[verifier.environment]
docker_image = "<PUBLIC_REGISTRY>/tcsexam:build-open-caccetta-haggkvist-verifier"
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384
storage_mb = 20480
