schema_version = "1.4"

# Preserve the final agent workspace before verification, including auxiliary sources.
artifacts = ["/app"]

[task]
name = "tcsexam/open-evasiveness-graph-properties"
version = "0.1.0"
description = "Prove or refute the evasiveness conjecture (Karp's conjecture, early 1970s: every nontrivial monotone graph property on v vertices requires all C(v,2) edge queries in the worst case) in Lean 4 (machine-verified). Open problem: no ground truth; the Lean kernel is the judge; no partial credit."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["lean4", "mathlib", "formal-proof", "decision-tree-complexity", "query-complexity", "graph-theory", "open-conjecture", "prove-or-refute", "type-2"]

[metadata]
family_id = "fam-evasiveness-graph-properties"
candidate_id = "cand-evasiveness-graph-properties"
problem_class = "lean-open-conjecture"
scaffold_level = "prove-or-refute-v1"
difficulty_explanation = "Open conjecture (unresolved since the early 1970s; proved for prime-power vertex numbers by Kahn-Saks-Sturtevant 1984, best general lower bound (1/3-o(1))*v^2 by Scheidweiler-Triesch 2013). Full score needs a kernel-verified proof or disproof; there is no partial credit."
source_paper = "R. Karp's conjecture, early 1970s; weaker form: A. L. Rosenberg, On the time required to recognize properties of graphs: a problem, SIGACT News 5(4), 1973, pp. 15-16. Survey: C. A. Miller, Evasiveness of Graph Properties and Topological Fixed-Point Theorems, Found. Trends Theor. Comput. Sci. 7(4), 2011, pp. 337-415 (arXiv:1306.0110)."

