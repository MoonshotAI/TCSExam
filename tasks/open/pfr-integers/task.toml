artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/open-pfr-integers"
version = "0.1.0"
description = "Prove or refute the polynomial Freiman-Ruzsa conjecture over the integers (Marton's conjecture in Z: if |A+A| <= K|A| then A is covered by K^{O(1)} translates of a convex body progression of dimension O(log K) and size K^{O(1)}|A|) in Lean 4 (machine-verified). Open problem: no ground truth; the Lean kernel is the judge. Proving either main statement (conj or refuted) scores 1.0; there is no partial credit."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["lean4", "mathlib", "formal-proof", "additive-combinatorics", "freiman-ruzsa", "sumsets", "open-conjecture", "prove-or-refute", "type-2"]

[metadata]
family_id = "fam-pfr-integers"
candidate_id = "cand-pfr-integers"
problem_class = "lean-open-conjecture"
scaffold_level = "prove-or-refute-v1"
difficulty_explanation = "Open conjecture (Ruzsa 1990s; GAP formulation disproved by Lovett-Regev, Discrete Analysis 2017:8; convex-progression formulation open). Full score needs a kernel-verified proof of one of the two main statements (conj or refuted); there are no checkpoints and no partial credit."
source_paper = "Lovett-Regev, Discrete Analysis 2017:8, Conjecture 1.2 (surviving convex-progression form); Manners, arXiv:1709.09738 (equivalent formulations). Background survey: addcomb-patterns.md (historical report not included in this package) (definition layer)."

[verifier]
timeout_sec = 18000.0

[agent]
timeout_sec = 43200.0

[environment]
os = "linux"
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384
storage_mb = 20480

[verifier.environment]
docker_image = "<PUBLIC_REGISTRY>/tcsexam:build-open-pfr-integers-verifier"
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384
storage_mb = 20480
