artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/open-d-vs-r-total-functions"
version = "0.1.0"
description = "Prove or refute, in Lean 4 (machine-verified), the open conjecture that every total Boolean function satisfies D(f) ≤ C·R(f)^2 (deterministic vs randomized decision-tree complexity; Nisan 1991 D = O(R^3), best separation quadratic). Open problem, mains-only: no partial credit."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["lean4", "mathlib", "formal-proof", "decision-tree-complexity", "open-problem", "prove-or-refute"]

[metadata]
family_id = "fam-d-vs-r-total-functions"
candidate_id = "cand-nisan1991-d-vs-r-quadratic"
problem_class = "lean-open-conjecture"
scaffold_level = "prove-or-refute-v1"
difficulty_explanation = "Open-problem task: the truth of the statement itself is unknown (stuck between exponents 2 and 3 since Nisan 1991). Full credit requires a kernel-verified proof of the conjecture or of its negation; there is no partial credit."
source_paper = "Nisan 1991, CREW PRAMs and decision trees, SICOMP 20(6) 999-1007 (D(f) = O(R(f)^3)); separation: Ambainis-Balodis-Belovs-Lee-Santha-Smotrovs, Separations in query complexity based on pointer functions, JACM 64(5) 2017 (D(f) = Ω~(R(f)^2)); status check: Hamoudi 2025, arXiv 2508.08852, Proposition 9."

[verifier]
timeout_sec = 18000.0

[agent]
timeout_sec = 43200.0

