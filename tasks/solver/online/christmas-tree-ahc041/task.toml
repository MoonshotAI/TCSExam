artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/christmas-tree-ahc041"
version = "1.0.0"
description = "Optimize a solver for a Christmas-tree cutting problem (N=1000-vertex planar graph, split into rooted trees of height at most 10): assign parents to maximize the weighted depth sum, practiced on 105 public instances from the same generator and judged once at the end on 45 hidden structure-preserving-transformed instances, scored continuously against an all-roots baseline and best-known scores from long simulated-annealing runs, under a 2 s per-instance wall-clock limit. Final score = the verifier's single final judging (final-once, no best-of)."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["solver", "optimization", "atcoder", "ahc", "graph-partition", "forest", "simulated-annealing", "type-2-solver"]

[metadata]
family_id = "fam-ahc"
candidate_id = "cand-christmas-tree-ahc041-solver"
problem_class = "solver-optimization"
scaffold_level = "full-context"
difficulty_explanation = "The rules are simple (pick a parent for each vertex, parent edges must exist in the graph, every parent chain must bottom out at a root within height 10) and a legal do-nothing solution is trivial — but the score grows with the depth of every vertex, so the whole game is growing deep, heavy trees while the height cap and the graph structure fight back. The depth-assignment view (each vertex needs one neighbor exactly one layer shallower) makes single-vertex local search easy to get right and hard to get good: escaping the local optima around depth profiles needs real annealing temperature, move design, and time allocation across instances."

[verifier]
network_mode = "allowlist"
allowed_hosts = []
timeout_sec = 1500.0

[agent]
network_mode = "allowlist"
allowed_hosts = []
timeout_sec = 43200.0

[environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 18000.0
cpus = 4
memory_mb = 8192
storage_mb = 8192

[environment.env]
TCSEXAM_TOKEN_ID = "${TCSEXAM_TOKEN_ID}"
TCSEXAM_TOKEN_SECRET = "${TCSEXAM_TOKEN_SECRET}"
TCSEXAM_BASE_URL = "${TCSEXAM_BASE_URL}"
CLAUDE_CODE_EFFORT_LEVEL = "${CLAUDE_CODE_EFFORT_LEVEL}"
CLAUDE_CODE_MAX_OUTPUT_TOKENS = "${CLAUDE_CODE_MAX_OUTPUT_TOKENS}"
CLAUDE_CODE_AUTO_COMPACT_WINDOW = "${CLAUDE_CODE_AUTO_COMPACT_WINDOW}"
CLAUDE_CODE_MAX_CONTEXT_TOKENS = "${CLAUDE_CODE_MAX_CONTEXT_TOKENS}"
CLAUDE_CODE_MAX_RETRIES = "${CLAUDE_CODE_MAX_RETRIES}"
CLAUDE_CODE_RETRY_WATCHDOG = "${CLAUDE_CODE_RETRY_WATCHDOG}"
API_TIMEOUT_MS = "${API_TIMEOUT_MS}"
