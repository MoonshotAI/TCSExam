artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/gp-dimacs10"
version = "1.0.0"
description = "Optimize a balanced graph partitioning solver (DIMACS10/Walshaw benchmark family + generated instances; form2: 30 public practice instances (+3 practice-only samples) + 13 hidden structure-preserved instances, final-once judging): minimize the k=4 / 3%-balance edge cut, scored once by the post-run judging on the hidden set against a single-call KaHIP FAST baseline and archive best-known cuts, under one shared time pool (60 s per instance x 13, GP_TIME_POOL, no per-instance limit)."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["solver", "optimization", "graph-partitioning", "dimacs10", "walshaw-archive", "kahip", "multilevel", "type-2-solver"]

[metadata]
family_id = "fam-gp"
candidate_id = "cand-gp-dimacs10-solver"
problem_class = "solver-optimization"
scaffold_level = "full-context"
difficulty_explanation = "The baseline is a single KaHIP FAST-mode call with a fixed seed; beating it is easy (multi-seed restarts, ECO/STRONG modes, spending the shared time pool where it pays), but closing the gap to the best-known cuts needs real partitioning engineering: the archive values were set by evolutionary/memetic and ILP-polished solvers run far longer than the pool, and the generated instances' reference cuts come from hours of strong KaHIP runs."

[verifier]
network_mode = "allowlist"
allowed_hosts = []
timeout_sec = 3600.0

[agent]
network_mode = "allowlist"
allowed_hosts = []
timeout_sec = 43200.0

[environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 18000.0
cpus = 4
memory_mb = 16384
storage_mb = 8192

[environment.env]
TCSEXAM_TOKEN_ID = "${TCSEXAM_TOKEN_ID}"
TCSEXAM_TOKEN_SECRET = "${TCSEXAM_TOKEN_SECRET}"
TCSEXAM_BASE_URL = "${TCSEXAM_BASE_URL}"
CLAUDE_CODE_EFFORT_LEVEL = "${CLAUDE_CODE_EFFORT_LEVEL}"
CLAUDE_CODE_MAX_OUTPUT_TOKENS = "${CLAUDE_CODE_MAX_OUTPUT_TOKENS}"
CLAUDE_CODE_AUTO_COMPACT_WINDOW = "${CLAUDE_CODE_AUTO_COMPACT_WINDOW}"
CLAUDE_CODE_MAX_CONTEXT_TOKENS = "${CLAUDE_CODE_MAX_CONTEXT_TOKENS}"
CLAUDE_CODE_MAX_RETRIES = "${CLAUDE_CODE_MAX_RETRIES}"
CLAUDE_CODE_RETRY_WATCHDOG = "${CLAUDE_CODE_RETRY_WATCHDOG}"
API_TIMEOUT_MS = "${API_TIMEOUT_MS}"
