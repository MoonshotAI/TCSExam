artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/coloring-dimacs"
version = "1.0.0"
description = "Optimize a graph coloring solver (DIMACS/COLOR02 benchmark instances; form2: 168 public practice instances + 72 hidden structure-preserved instances, final-once judging): minimize the number of colors, scored once by the post-run judging on the hidden set against a textbook TabuCol baseline and literature best-known color counts, under a 180 s per-instance wall-clock limit."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["solver", "optimization", "graph-coloring", "dimacs", "graph-algorithms", "metaheuristics", "type-2-solver"]

[metadata]
family_id = "fam-coloring"
candidate_id = "cand-coloring-dimacs-solver"
problem_class = "solver-optimization"
scaffold_level = "full-context"
difficulty_explanation = "Graph coloring is NP-hard to approximate within n^(1-eps) (Feige-Kilian/Zuckerman). The shipped baseline is a textbook TabuCol (Hertz & de Werra 1987) with a fixed iteration budget: it reaches the known optimum on small or highly structured instances but stalls several colors above the best known value on random DSJC graphs, queen graphs, Latin-square graphs and the larger flat/le450 instances. Closing that gap within a 180 s per-instance limit needs real machinery — iterated/adaptive local search, population hybrids (Galinier-Hao crossover), lower-bound-guided search — and the continuous score rewards every color saved; the literature anchors come from hours-long runs of state-of-the-art heuristics."

[verifier]
network_mode = "allowlist"
allowed_hosts = []
timeout_sec = 7200.0

[agent]
network_mode = "allowlist"
allowed_hosts = []
timeout_sec = 43200.0

[environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 18000.0
cpus = 4
memory_mb = 8192
storage_mb = 8192

[environment.env]
TCSEXAM_TOKEN_ID = "${TCSEXAM_TOKEN_ID}"
TCSEXAM_TOKEN_SECRET = "${TCSEXAM_TOKEN_SECRET}"
TCSEXAM_BASE_URL = "${TCSEXAM_BASE_URL}"
CLAUDE_CODE_EFFORT_LEVEL = "${CLAUDE_CODE_EFFORT_LEVEL}"
CLAUDE_CODE_MAX_OUTPUT_TOKENS = "${CLAUDE_CODE_MAX_OUTPUT_TOKENS}"
CLAUDE_CODE_AUTO_COMPACT_WINDOW = "${CLAUDE_CODE_AUTO_COMPACT_WINDOW}"
CLAUDE_CODE_MAX_CONTEXT_TOKENS = "${CLAUDE_CODE_MAX_CONTEXT_TOKENS}"
CLAUDE_CODE_MAX_RETRIES = "${CLAUDE_CODE_MAX_RETRIES}"
CLAUDE_CODE_RETRY_WATCHDOG = "${CLAUDE_CODE_RETRY_WATCHDOG}"
API_TIMEOUT_MS = "${API_TIMEOUT_MS}"
