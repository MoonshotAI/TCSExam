artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/ce-pace2021"
version = "1.2.0"
description = "Optimize a cluster editing solver (PACE 2021 heuristic-track): minimize edge edits on the 100 private hidden instances, scored continuously against a naive baseline and champion-grade best-known values, under the official 600 s per-instance limit."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["solver", "optimization", "cluster-editing", "pace-2021", "graph-algorithms", "type-2-solver"]

[metadata]
family_id = "fam-ce"
candidate_id = "cand-ce-pace2021-solver"
problem_class = "solver-optimization"
scaffold_level = "full-context"
difficulty_explanation = "A greedy closed-neighborhood clustering heuristic is easy to beat (reduction rules, better pivots, local search on the clustering all help), but closing the gap to champion-grade edit counts needs real algorithmic ideas; the continuous score rewards every saved edit, and the official 600-second per-instance budget rewards solvers that scale."

[verifier]
network_mode = "allowlist"
allowed_hosts = []
timeout_sec = 7200.0

[agent]
network_mode = "allowlist"
allowed_hosts = []
timeout_sec = 43200.0

[environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 18000.0
cpus = 16
memory_mb = 8192
storage_mb = 8192

[environment.env]
TCSEXAM_TOKEN_ID = "${TCSEXAM_TOKEN_ID}"
TCSEXAM_TOKEN_SECRET = "${TCSEXAM_TOKEN_SECRET}"
TCSEXAM_BASE_URL = "${TCSEXAM_BASE_URL}"
CLAUDE_CODE_EFFORT_LEVEL = "${CLAUDE_CODE_EFFORT_LEVEL}"
CLAUDE_CODE_MAX_OUTPUT_TOKENS = "${CLAUDE_CODE_MAX_OUTPUT_TOKENS}"
CLAUDE_CODE_AUTO_COMPACT_WINDOW = "${CLAUDE_CODE_AUTO_COMPACT_WINDOW}"
CLAUDE_CODE_MAX_CONTEXT_TOKENS = "${CLAUDE_CODE_MAX_CONTEXT_TOKENS}"
CLAUDE_CODE_MAX_RETRIES = "${CLAUDE_CODE_MAX_RETRIES}"
CLAUDE_CODE_RETRY_WATCHDOG = "${CLAUDE_CODE_RETRY_WATCHDOG}"
API_TIMEOUT_MS = "${API_TIMEOUT_MS}"
