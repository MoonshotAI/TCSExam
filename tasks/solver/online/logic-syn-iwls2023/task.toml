artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/logic-syn-iwls2023"
version = "1.0.0"
description = "Optimize a logic synthesis solver (IWLS 2023 contest instances, truth tables up to 16 inputs): synthesize functionally equivalent two-input AND-inverter graphs with the fewest AND gates on hidden instances, scored against a fixed weak ABC flow baseline and verified contest best-known values (best per function across the published submissions of both IWLS 2022 and 2023 — the 2023 benchmark is the 2022 set NPN-re-encoded — re-verified by exhaustive simulation)."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["solver", "optimization", "logic-synthesis", "aig", "iwls2023", "eda", "type-2-solver"]

[metadata]
family_id = "fam-lsyn"
candidate_id = "cand-logic-syn-iwls2023-solver"
problem_class = "solver-optimization"
scaffold_level = "full-context"
difficulty_explanation = "Beating the fixed one-shot dc2 baseline is easy (any iterated ABC script such as resyn2 already lands well below it), but approaching the contest best-known values needs real synthesis engineering: scripting diverse ABC flows per function class, orchestrating many runs under one shared time pool, and verifying equivalence before trusting a candidate circuit; the continuous score rewards every AND gate shaved off."

[verifier]
network_mode = "allowlist"
allowed_hosts = []
timeout_sec = 7200.0

[agent]
network_mode = "allowlist"
allowed_hosts = []
timeout_sec = 43200.0

[environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 18000.0
cpus = 4
memory_mb = 8192
storage_mb = 8192

[environment.env]
TCSEXAM_TOKEN_ID = "${TCSEXAM_TOKEN_ID}"
TCSEXAM_TOKEN_SECRET = "${TCSEXAM_TOKEN_SECRET}"
TCSEXAM_BASE_URL = "${TCSEXAM_BASE_URL}"
CLAUDE_CODE_EFFORT_LEVEL = "${CLAUDE_CODE_EFFORT_LEVEL}"
CLAUDE_CODE_MAX_OUTPUT_TOKENS = "${CLAUDE_CODE_MAX_OUTPUT_TOKENS}"
CLAUDE_CODE_AUTO_COMPACT_WINDOW = "${CLAUDE_CODE_AUTO_COMPACT_WINDOW}"
CLAUDE_CODE_MAX_CONTEXT_TOKENS = "${CLAUDE_CODE_MAX_CONTEXT_TOKENS}"
CLAUDE_CODE_MAX_RETRIES = "${CLAUDE_CODE_MAX_RETRIES}"
CLAUDE_CODE_RETRY_WATCHDOG = "${CLAUDE_CODE_RETRY_WATCHDOG}"
API_TIMEOUT_MS = "${API_TIMEOUT_MS}"
