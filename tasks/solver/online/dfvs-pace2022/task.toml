artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/dfvs-pace2022"
version = "1.0.0"
description = "Optimize a directed-feedback-vertex-set solver (PACE 2022 exact track): minimize set size on the full 200-instance official set, scored continuously against baseline and proven-optimal values, under the official 1800 s per-instance limit."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["solver", "optimization", "directed-feedback-vertex-set", "pace-2022", "graph-algorithms", "type-2-solver"]

[metadata]
family_id = "fam-dfvs"
candidate_id = "cand-dfvs-pace2022-solver"
problem_class = "solver-optimization"
scaffold_level = "full-context"
difficulty_explanation = "A greedy cycle-breaking heuristic is easy to beat (degree-2 reductions, SCC decomposition, local search all help), but closing the gap to champion-grade DFVS sizes needs real algorithmic ideas; the continuous score rewards every deleted vertex."

[verifier]
network_mode = "allowlist"
allowed_hosts = []
timeout_sec = 24000.0

[agent]
network_mode = "allowlist"
allowed_hosts = []
timeout_sec = 43200.0

[environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 18000.0
cpus = 16
memory_mb = 8192
storage_mb = 8192

[environment.env]
TCSEXAM_TOKEN_ID = "${TCSEXAM_TOKEN_ID}"
TCSEXAM_TOKEN_SECRET = "${TCSEXAM_TOKEN_SECRET}"
TCSEXAM_BASE_URL = "${TCSEXAM_BASE_URL}"
CLAUDE_CODE_EFFORT_LEVEL = "${CLAUDE_CODE_EFFORT_LEVEL}"
CLAUDE_CODE_MAX_OUTPUT_TOKENS = "${CLAUDE_CODE_MAX_OUTPUT_TOKENS}"
CLAUDE_CODE_AUTO_COMPACT_WINDOW = "${CLAUDE_CODE_AUTO_COMPACT_WINDOW}"
CLAUDE_CODE_MAX_CONTEXT_TOKENS = "${CLAUDE_CODE_MAX_CONTEXT_TOKENS}"
CLAUDE_CODE_MAX_RETRIES = "${CLAUDE_CODE_MAX_RETRIES}"
CLAUDE_CODE_RETRY_WATCHDOG = "${CLAUDE_CODE_RETRY_WATCHDOG}"
API_TIMEOUT_MS = "${API_TIMEOUT_MS}"
