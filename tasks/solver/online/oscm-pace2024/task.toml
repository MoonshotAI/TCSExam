artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/oscm-pace2024"
version = "1.0.0"
description = "Optimize a one-sided crossing minimization solver (PACE 2024 exact track): minimize crossings on the full 200-instance official set, scored continuously against baseline and proven-optimal values, under the official 1800 s per-instance limit."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["solver", "optimization", "crossing-minimization", "graph-drawing", "pace-2024", "type-2-solver"]

[metadata]
family_id = "fam-ocm"
candidate_id = "cand-oscm-pace2024-solver"
problem_class = "solver-optimization"
scaffold_level = "full-context"
difficulty_explanation = "The shipped baseline is already the classic barycenter+sifting pipeline run to convergence, and K is the PROVEN optimum: the score measures the thin residual that classic local search cannot reach, so multi-start diversification only gets you part of the way and matching the optimum needs exact-track ideas (reduction rules, branch and bound); the 1800 s per-instance budget is generous, so the bottleneck is search quality, not time allocation."

[verifier]
network_mode = "allowlist"
allowed_hosts = []
timeout_sec = 24000.0

[agent]
network_mode = "allowlist"
allowed_hosts = []
timeout_sec = 43200.0

[environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 18000.0
cpus = 16
memory_mb = 8192
storage_mb = 8192

[environment.env]
TCSEXAM_TOKEN_ID = "${TCSEXAM_TOKEN_ID}"
TCSEXAM_TOKEN_SECRET = "${TCSEXAM_TOKEN_SECRET}"
TCSEXAM_BASE_URL = "${TCSEXAM_BASE_URL}"
CLAUDE_CODE_EFFORT_LEVEL = "${CLAUDE_CODE_EFFORT_LEVEL}"
CLAUDE_CODE_MAX_OUTPUT_TOKENS = "${CLAUDE_CODE_MAX_OUTPUT_TOKENS}"
CLAUDE_CODE_AUTO_COMPACT_WINDOW = "${CLAUDE_CODE_AUTO_COMPACT_WINDOW}"
CLAUDE_CODE_MAX_CONTEXT_TOKENS = "${CLAUDE_CODE_MAX_CONTEXT_TOKENS}"
CLAUDE_CODE_MAX_RETRIES = "${CLAUDE_CODE_MAX_RETRIES}"
CLAUDE_CODE_RETRY_WATCHDOG = "${CLAUDE_CODE_RETRY_WATCHDOG}"
API_TIMEOUT_MS = "${API_TIMEOUT_MS}"
