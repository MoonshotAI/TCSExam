artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/nurse-inrc"
version = "1.0.0"
description = "Optimize a nurse rostering solver (the complete INRC-I 60-instance library hidden from the agent, 28-day rosters, up to 50 nurses): minimize the soft-constraint penalty under exact coverage, scored against a greedy + local-search baseline and the best-known values of the First International Nurse Rostering Competition (2010)."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["solver", "optimization", "nurse-rostering", "inrc", "scheduling", "local-search", "type-2-solver"]

[metadata]
family_id = "fam-nurse"
candidate_id = "cand-nurse-inrc-solver"
problem_class = "solver-optimization"
scaffold_level = "full-context"
difficulty_explanation = "The baseline already produces feasible rosters; beating it needs better search (metaheuristics over coverage-preserving moves), and closing the gap to the competition best-known values needs real algorithmic work: good neighbourhood design, restarts tuned to the per-instance budget, per-track effort allocation. Instances range from 10-nurse sprints to 50-nurse two-skill longs."

[verifier]
network_mode = "allowlist"
allowed_hosts = []
timeout_sec = 18000.0

[agent]
network_mode = "allowlist"
allowed_hosts = []
timeout_sec = 43200.0

[environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 8192

[environment.env]
TCSEXAM_TOKEN_ID = "${TCSEXAM_TOKEN_ID}"
TCSEXAM_TOKEN_SECRET = "${TCSEXAM_TOKEN_SECRET}"
TCSEXAM_BASE_URL = "${TCSEXAM_BASE_URL}"
CLAUDE_CODE_EFFORT_LEVEL = "${CLAUDE_CODE_EFFORT_LEVEL}"
CLAUDE_CODE_MAX_OUTPUT_TOKENS = "${CLAUDE_CODE_MAX_OUTPUT_TOKENS}"
CLAUDE_CODE_AUTO_COMPACT_WINDOW = "${CLAUDE_CODE_AUTO_COMPACT_WINDOW}"
CLAUDE_CODE_MAX_CONTEXT_TOKENS = "${CLAUDE_CODE_MAX_CONTEXT_TOKENS}"
CLAUDE_CODE_MAX_RETRIES = "${CLAUDE_CODE_MAX_RETRIES}"
CLAUDE_CODE_RETRY_WATCHDOG = "${CLAUDE_CODE_RETRY_WATCHDOG}"
API_TIMEOUT_MS = "${API_TIMEOUT_MS}"
