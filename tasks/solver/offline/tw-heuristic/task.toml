artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/tw-heuristic"
version = "1.0.0"
description = "Optimize a treewidth-decomposition solver (PACE 2017 heuristic-track): minimize decomposition widths on the 100 private hidden instances, scored continuously against a FlowCutter baseline and best-known reference widths, under the official 1800 s per-instance budget."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["solver", "optimization", "treewidth", "pace-2016", "pace-2017", "graph-decomposition", "type-2-solver"]

[metadata]
family_id = "fam-treewidth"
candidate_id = "cand-tw-heuristic-pilot"
problem_class = "solver-optimization"
scaffold_level = "full-context"
difficulty_explanation = "The baseline is FlowCutter, a PACE heuristic-track winner, so beating it within the same total time pool demands real algorithmic work (smarter pool allocation, restarts, preprocessing, local improvement) — but the score is continuous, so every shaved unit of width counts; beating the best-known reference width is a genuine research-level result on some instances."

[verifier]
timeout_sec = 1209600.0

[agent]
network_mode = "allowlist"
allowed_hosts = []
timeout_sec = 43200.0

[environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 18000.0
cpus = 16
memory_mb = 8192
storage_mb = 8192


[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 3600.0
