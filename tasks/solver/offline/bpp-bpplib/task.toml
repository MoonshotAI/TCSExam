schema_version = "1.4"

# Root-level field; it must appear before the first [section]. If placed in the [task] section, pydantic silently ignores it and it has no effect.
artifacts = ["/app"]

[task]
name = "tcsexam/bpp-bpplib"
version = "1.0.0"
description = "Optimize a one-dimensional bin packing solver (90 public practice instances from a public bin-packing benchmark library, plus a 6,216-instance background library; final judging once on 39 hidden instances): minimize the number of bins under one shared time pool — scored against a First-Fit Decreasing baseline and registered proven optima."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["solver", "optimization", "bin-packing", "cutting-stock", "bpplib", "exact-methods", "type-2-solver"]

[metadata]
family_id = "fam-bpp"
candidate_id = "cand-bpp-bpplib-solver"
problem_class = "solver-optimization"
scaffold_level = "full-context"
difficulty_explanation = "Beating plain First-Fit Decreasing looks easy on paper (the gap is one bin on most instances), but K is the proven optimum everywhere: closing that last bin needs real bin-packing machinery (bin completion / MTP-style branch-and-bound, reduction, good lower bounds), and the large GI/Scholl-N4 instances punish naive exact search; the shared time pool forces allocation strategy across 129 instances."

[agent]
network_mode = "allowlist"
allowed_hosts = []
timeout_sec = 43200.0

