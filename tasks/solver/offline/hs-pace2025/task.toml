artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/hs-pace2025"
version = "1.0.0"
description = "Optimize a hitting-set solver (PACE 2025 heuristic track): minimize solution size on the 100 private hidden instances, scored continuously against baseline and champion reference results, under the official 300 s per-instance limit."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["solver", "optimization", "hitting-set", "pace-2025", "hypergraph", "type-2-solver"]

[metadata]
family_id = "fam-hitting-set"
candidate_id = "cand-hs2025-solver"
problem_class = "solver-optimization"
scaffold_level = "full-context"
difficulty_explanation = "Beating naive set-cover greedy is easy to start (reductions, restarts), but the reference is the field-best of the PACE 2025 heuristic champion (Root) and exact champion (UzL) full-budget runs; closing that gap needs real algorithm engineering (reductions, local search) under a 300 s per-instance limit."

[verifier]
timeout_sec = 1209600.0

[agent]
network_mode = "allowlist"
allowed_hosts = []
timeout_sec = 43200.0

[environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 18000.0
cpus = 16
memory_mb = 16384
storage_mb = 8192


[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 3600.0
