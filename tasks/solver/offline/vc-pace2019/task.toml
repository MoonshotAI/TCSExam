artifacts = ["/app"]
schema_version = "1.4"

[task]
name = "tcsexam/vc-pace2019"
version = "1.0.0"
description = "Solve vertex cover exactly (PACE 2019 exact track): on the full set of 100 official private instances, output a valid vertex cover whose size equals the reference value on file (a proven optimum for 81 instances, a pinned best-known upper bound for 19), under the official 1800 s per-instance budget; reward is the solved-coverage gain over a naive exact branch-and-reduce baseline."
authors = [{ name = "TCSExam Contributors" }]
keywords = ["solver", "exact", "vertex-cover", "pace-2019", "graph-algorithms", "type-2-solver"]

[metadata]
family_id = "fam-vc"
candidate_id = "cand-vc-pace2019-solver"
problem_class = "solver-optimization"
scaffold_level = "full-context"
difficulty_explanation = "Optimality is required, not just a small cover: the shipped naive branch-and-reduce baseline already proves the easy instances, and every further point needs exact machinery that survives the medium/hard ones — stronger kernelization (crown/LP reductions), component splitting, better lower bounds, branch-and-reduce — inside the official 1800 s per-instance budget; the score is continuous in solved coverage, so every additionally settled instance counts."

[verifier]
timeout_sec = 1209600.0

[agent]
network_mode = "allowlist"
allowed_hosts = []
timeout_sec = 43200.0

[environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 18000.0
cpus = 16
memory_mb = 8192
storage_mb = 8192


[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 3600.0
