name: Source and score checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[runtime,backend]' pytest
      - run: PYTHONPATH=src python -m tcsexam source-inputs
      - run: PYTHONPATH=src python -m tcsexam validate
      - run: PYTHONPATH=src python -m tcsexam.recipes --check
      - run: test -z "$(find tasks assets -name '*.sh' ! -executable -print)"
      - run: PYTHONPATH=src python -m pytest src/tcsexam/backend/tests src/tcsexam/tests -q
      - run: PYTHONPATH=src python -m tcsexam export --normalize-modes --output build/source-candidate
      - run: PYTHONPATH=src python -m tcsexam validate --root build/source-candidate
      - run: PYTHONPATH=src python -m tcsexam check-public --root build/source-candidate --phase source
