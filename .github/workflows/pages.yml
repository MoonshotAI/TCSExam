name: Website and bilingual documentation

on:
  push:
    branches: [master, gh-pages]
  pull_request:
    branches: [master, gh-pages]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GitHub Pages after the preview has been reviewed
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tcsexam-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    # Pin the input contract; publish a compatible website workflow before updating this SHA.
    uses: MoonshotAI/TCSExam/.github/workflows/site-build.yml@2b645706eeff2d1e73e464b77897c1363012e285
    with:
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
      source-ref: ${{ (github.ref_name == 'gh-pages' || github.base_ref == 'gh-pages') && github.event.repository.default_branch || github.sha }}
      website-ref: ${{ (github.ref_name == 'gh-pages' || github.base_ref == 'gh-pages') && github.sha || 'gh-pages' }}
